[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice2form"
version = "0.1.0"
description = "ML-powered voice-to-text system for auto-filling government, healthcare, and banking forms in regional Indian languages."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["asr", "speech-to-text", "nlp", "regional-languages", "india", "accessibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
audio = [
    "librosa>=0.10",
    "torchaudio>=2.0",
]
asr = [
    "openai-whisper>=20231117",
    "transformers>=4.35",
    "torch>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
